ipv6: false
vif_only: true
hijack_dns:
- '*'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204
compat_route: false
include_all_networks: false
include_apns: false
real_ip_domains:
- '*.lan'
- '*.local'
- '*.push.apple.com'
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    Domestic-DNS:
    - https://223.5.5.5/dns-query
    - tls://223.5.5.5
    - https://120.53.53.53/dns-query
    - tls://1.12.12.12
  forward:
  - domain_wildcard:
      match: '*'
      value: Domestic-DNS
  proxy_nameservers:
  - https://223.5.5.5/dns-query
  - tls://223.5.5.5
  - https://120.53.53.53/dns-query
  - tls://1.12.12.12
  block_ips:
  - 0.0.0.0
  - 127.0.0.1
proxies: []
policy_groups:
- select:
    name: Proxy
    policies: []
    flatten: false
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/egern-anti-dns-leak/main/icons/Proxy.png
    hidden: false
- smart:
    name: AI
    policies:
    - Proxy
    flatten: false
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/egern-anti-dns-leak/main/icons/openai.png
    hidden: false
- select:
    name: AD
    policies:
    - REJECT
    - DIRECT
    flatten: false
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/egern-anti-dns-leak/main/icons/AdBlock.png
    hidden: false
- select:
    name: Final
    policies:
    - Proxy
    flatten: false
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/egern-anti-dns-leak/main/icons/Final.png
    hidden: false
rules:
- rule_set:
    match: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge.list
    policy: AD
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list
    policy: DIRECT
    disabled: false
- rule_set:
    name: AI
    match: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/75f0101039d71724b6e998b34604c2e053580e0c/Clash/Ruleset/AI.list
    policy: AI
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt
    policy: DIRECT
- domain_suffix:
    match: cn
    policy: DIRECT
- geoip:
    match: CN
    policy: DIRECT
    no_resolve: true
- default:
    name: Final
    policy: Final
default_proxy_group: Proxy
