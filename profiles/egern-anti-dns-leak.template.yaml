rules:
# ---- DNS 端点固定路由（置于最前，保证任何规则集都拦不到它们）----------------
# 为什么要显式写：geoip: CN 加上 no_resolve 之后只匹配「已经是 IP」的连接，
# 不再匹配域名。加密 DNS 端点若写成主机名，就会一路落到 default -> Final -> Proxy。
# 顺序：先钉住国内端点（直连），再钉住境外端点（经代理）。
- domain_suffix:
    match: alidns.com
    policy: DIRECT
- domain:
    match: doh.pub
    policy: DIRECT
- ip_cidr:
    match: 223.5.5.5/32
    policy: DIRECT
    no_resolve: true
- ip_cidr:
    match: 223.6.6.6/32
    policy: DIRECT
    no_resolve: true
- ip_cidr:
    match: 1.12.12.12/32
    policy: DIRECT
    no_resolve: true
- ip_cidr:
    match: 120.53.53.53/32
    policy: DIRECT
    no_resolve: true
- domain:
    match: dns.google
    policy: Proxy
- domain_suffix:
    match: cloudflare-dns.com
    policy: Proxy
- ip_cidr:
    match: 8.8.8.8/32
    policy: Proxy
    no_resolve: true
- ip_cidr:
    match: 8.8.4.4/32
    policy: Proxy
    no_resolve: true
- ip_cidr:
    match: 1.1.1.1/32
    policy: Proxy
    no_resolve: true
- ip_cidr:
    match: 1.0.0.1/32
    policy: Proxy
    no_resolve: true
- ip_cidr:
    match: 9.9.9.9/32
    policy: Proxy
    no_resolve: true
- ip_cidr:
    match: 208.67.222.222/32
    policy: Proxy
    no_resolve: true
- ip_cidr:
    match: 208.67.220.220/32
    policy: Proxy
    no_resolve: true
