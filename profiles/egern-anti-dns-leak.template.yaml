ipv6: false
vif_only: true
hijack_dns:
- '*'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204
compat_route: false
include_all_networks: false
include_apns: false
real_ip_domains:
# 这几个域名不做 Fake IP 映射，交给系统解析。
# Windows/Apple 的推送与内网发现走的是「隧道外」的链路（include_apns: false），
# 用 Fake IP 反而会让推送异常，所以这里必须放行。
- '*.lan'
- '*.local'
- '*.push.apple.com'
dns:
  # ================================================================ 设计前提
  # 官方 DNS 文档逐字规定（本节所有取舍的唯一依据）：
  #   1) 「默认 DNS：处理用户流量的域名解析，按 Forward 规则匹配上游，未命中回退到
  #       Bootstrap；连接上游时遵循代理规则。」
  #   2) 「Bootstrap……仅支持传统 UDP 协议（端口 53），且不遵循代理规则——流量直连。
  #       它有两个用途：① 解析 upstreams 中加密 DNS 服务器的主机名；② 作为最终的 DNS 回退。」
  #   3) 「未配置或解析失败时，自动使用系统 DNS 服务器。」（system = Wi-Fi/蜂窝下发的 DNS）
  #
  # ⇒ 本文件里唯一可能把查询暴露给「中国电信」的，就是 bootstrap 这条明文 UDP:53 路径：
  #      电信蜂窝上它要么被运营商透明重定向到电信自己的解析器，要么直接失败；
  #      失败后按第 3 条掉到「系统 DNS」——而系统 DNS 就是电信下发的那个。
  #    dnsleaktest 显示的 59.37.178.86 / 219.128.128.90（AS4134 广东电信）就出自这里，
  #    与 forward 里挂的是阿里还是 Google 无关。
  #
  # ⇒ 所以本节的目标不是「给 bootstrap 换个更安全的服务器」（国内不存在可达的境外
  #    UDP:53 解析器），而是让 bootstrap 的两条用途都无事可做：
  #      用途① 用 IP 字面量端点消灭（见 upstreams）；
  #      用途② 让 forward 兜底指向一个「不依赖代理也永远活着」的组（见 forward 的两条兜底）。
  # ================================================================ 启动 DNS
  # 剩下的作用：极端情况下（所有加密上游同时不可用）的最后一道明文回退。
  # 列 3 个国内大厂明文 IP，只为把「全失败 → 掉到系统 DNS（电信）」的概率压到最低。
  # ⚠️ 不要在这里写 system —— 那等于主动把运营商 DNS 接进来。
  bootstrap:
  - 223.5.5.5
  - 223.6.6.6
  - 119.29.29.29
  # ================================================================ 上游 DNS 组
  upstreams:
    # ---- 国内域名：国内加密 DNS，全部 IP 字面量 ----------------------------
    # 为什么必须写 IP 而不是 dns.alidns.com：官方第 2 条明确 bootstrap 的用途之一就是
    # 「解析 upstreams 中加密 DNS 服务器的主机名」。只要端点是主机名，就必然要有一次
    # 明文查询；写 IP 字面量则一次都不产生，零依赖（不再依赖 hosts 是否命中）。
    # 下面 6 个端点已逐个实测（RFC8484 线格式 GET ?dns= + DoT 853 握手，见报告表）：
    #   223.5.5.5 / 223.6.6.6 / 1.12.12.12 / 120.53.53.53 -> HTTP 200 + 有效 A 记录
    #   tls://223.5.5.5 -> 证书 CN=*.alidns.com（覆盖 IP）；tls://1.12.12.12 -> CN=120.53.53.53
    # 两家机构 × 两种协议 × 各两个 IP：任一组合存活，本组就不会「全失败」。
    Domestic-DNS:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - https://1.12.12.12/dns-query
    - https://120.53.53.53/dns-query
    - tls://223.5.5.5
    - tls://1.12.12.12
    # ---- 境外加密 DNS（v10 起无任何引用，保留为 A/B 备用，不影响泄露面）-------------
    # ⚠️ 本组从 v6 起从 forward 兜底上摘了下来：它的端点必须经代理才可达，把兜底
    #    挂在它身上等于「先有代理，才敢解析」—— 代理未就绪时那次解析会掉进 bootstrap
    #    明文，在电信蜂窝上就是泄露给电信。改用 Domestic-DNS 兜底（见 forward 的两条兜底）。
    #    要切回 v5 的行为：把 forward 最后两条的 value 改回 Foreign-DNS 即可。
    # 6 个端点、三家机构。关键点有两个：
    #   ① IP 字面量 ⇒ 不需要 bootstrap（否则 dns.google 这个名字本身在国内就拿不到真 IP，
    #      这一步一失败，整组就废，随后就是回退明文 —— 这正是原配置的写法带来的后果）；
    #   ② rules 段开头已把这 5 个 IP 全部判给 Proxy（规则 8/9/10/11/12），配合官方第 1 条
    #      「连接上游时遵循代理规则」，链路是「设备 → 代理 → 8.8.8.8」，
    #      于是从电信蜂窝上也能正常解析，且全程加密、不经过国内网络。
    # 实测（逐个跑过）：
    #   https://8.8.8.8 / 8.8.4.4 / 1.1.1.1 / 1.0.0.1  -> HTTP 200
    #   https://9.9.9.9                             -> 失败！HTTP Version Not Supported
    #     （Quad9 在 9.9.9.9 上只提供 HTTP/3，不响应 HTTP/1.1 线格式；149.112.112.112 同样）
    #   tls://9.9.9.9 -> 证书 CN=dns.quad9.net，正常应答 ⇒ Quad9 只能走 DoT
    # 为什么多列几个：官方「同一组内的多个服务器并发竞速，由响应最快者胜出」。
    # 触发回退的唯一条件是「这一组全部失败」，端点越多越不可能。
    Foreign-DNS:
    - https://8.8.8.8/dns-query
    - https://8.8.4.4/dns-query
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
    - tls://8.8.8.8
    - tls://9.9.9.9
  forward:
  # ============ Forward 规则（v10 起：塌缩为 2 条兜底，与订阅彻底解耦）============
  # ★ v10 的唯一改动：删掉原第 1~8 条规则，只留最后两条兜底。
  #   删掉的 8 条 = [1] domain_suffix: cn  [2] proxy_rule_set: ChinaDomain.list
  #                 [3~5] 三个机场节点域名  [6~8] cp.cloudflare.com /
  #                 connectivitycheck.platform.hicloud.com / jsdelivr.net
  #
  # 为什么可以删 —— 两个结构性事实（官方 dns 文档逐字支持）：
  #   ① 「Forward 规则按声明顺序求值，第一条命中的决定上游」；而原 10 条规则的
  #      value **全部都是 Domestic-DNS**（单值）。每条的结果都一样 ⇒ **顺序与域名
  #      清单都不影响结果** ⇒ 删掉其中任何一条都不改变行为（可用 scripts/audit_dns_forward.py
  #      验证：它会打印 value 集合并对任意域名做演练）。
  #   ② 「配置了 proxy_nameservers 后，代理 DNS 会**跳过 Forward 阶段**，直接走该
  #      列表」；而节点域名的解析走的正是代理 DNS ⇒ **它们本来就不会查询本节**。
  #      所以原第 3~5 条（机场节点域名）自 v7 写出 proxy_nameservers 起就是死代码。
  #   ⇒ 结论：换订阅、换机场、换节点域名、换中转 CDN，**本节都不需要改一个字**。
  #      这也正是 Surge 那套配置的形态（一份加密 DNS 列表 + 全直连，不按域名分流 DNS）。
  #
  # 为什么兜底必须是 Domestic-DNS（而不是境外组）：
  #   ① 官方只写了「未命中 Forward 回退 Bootstrap」，「命中的组端点全失败」会怎样
  #      并未写明。兜底挂境外组，就等于把一条未定义的分支留给明文 UDP:53。
  #   ② 兜底组若需经代理，就引入隐式依赖「先有代理，才敢解析」。启动阶段（规则集与
  #      geoip/asn DB 下载、策略组首轮测速）代理尚未就绪，此时任何一次本地解析都会
  #      掉进 bootstrap 明文 —— 电信蜂窝上就是泄露给电信。
  #   ③ 实际运行中本地解析只服务于 DIRECT 域名。本配置 DIRECT 的域名来源是：
  #        规则 0/1   alidns.com / doh.pub                 （国内）
  #        规则 19    Lan.list                             （私网）
  #        规则 41    Apple_All_No_Resolve.list            （Apple，国内有 CDN）
  #        规则 43    xhscdn.com                           （国内）
  #        规则 44    ChinaMax_All_No_Resolve.list         （国内 111,332 条域名）
  #        规则 45    domain_suffix: cn                    （国内）
  #      全是国内与 Apple 域名 —— 国内加密 DNS 对它们本来就更优更快。而走代理的域名
  #      由节点远程解析（代理 DNS），根本不经过本节，所以不存在「需要境外答案」的域名。
  #   ④ 兜底组 Domestic-DNS 的 6 个端点全部是 IP 字面量 ⇒ 自身不需要 bootstrap 解析；
  #      且 223.5.5.5 / 223.6.6.6 / 1.12.12.12 / 120.53.53.53 在 rules 里判给 DIRECT
  #      ⇒ **不依赖代理也永远活着**（启动阶段可用）。
  #   两条兜底刻意用两种互不依赖的匹配语义（官方：domain_regex 是 PCRE2 find 式，
  #   '.' 命中任意子串；domain_wildcard 是官方示例与社区配置的主用法）。任何一条生效，
  #   bootstrap 都不会成为用户域名的回退。
  - domain_regex:
      match: '.'
      value: Domestic-DNS
  - domain_wildcard:
      match: '*'
      value: Domestic-DNS
  # ★ v7 改动 B：显式写 proxy_nameservers（v1~v6 都是不写）。
  #   官方 dns 文档原文：「未配置时，代理 DNS 与默认 DNS 共用 Forward 规则，**未命中回退到
  #   Bootstrap**」—— 也就是「不设置」这件事本身，就留下了一条通往明文 UDP:53 的兜底分支。
  #   设置后官方语义是「所有代理 DNS 查询强制走该列表，**Forward 规则会被跳过**」，
  #   于是那条回退分支在结构上不再存在。
  #   为什么只能用国内端点：代理 DNS 是**强制直连**的（官方：避免 DNS→代理→DNS 循环依赖），
  #   境外解析器在电信线路上根本不可达 —— 那正是 bootstrap 会被逼出来的原因。
  #   下面 6 个端点与上面的 Domestic-DNS 完全相同、全部是 IP 字面量（⇒ 自身不需要 bootstrap
  #   解析），且已用 scripts/probe_dns_endpoints.py 逐个实测可用。
  #   如果你发现「节点连不上」，第一件事是注释掉这 6 行（等价于回到 v6 的行为）。
  proxy_nameservers:
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
  - https://1.12.12.12/dns-query
  - https://120.53.53.53/dns-query
  - tls://223.5.5.5
  - tls://1.12.12.12
  # ---------------------------------------------------------------- 主机名固定
  # 把加密 DNS 端点的主机名直接钉到 IP：省掉一次解析，同时让 bootstrap 无事可做。
  # 与社区参考配置（Repcz/Tool）的取值逐字一致。
  hosts:
    dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
    doh.pub:
    - 1.12.12.12
    - 120.53.53.53
    dot.pub:
    - 1.12.12.12
    - 120.53.53.53
  # ---------------------------------------------------------------- 污染应答过滤
  # 丢弃空路由式应答（0.0.0.0 / 127.0.0.1）。官方说明此字段用于对抗 DNS 污染。
  # 刻意不放 10.0.0.0/8 等私网段，避免误伤内网域名的解析结果。
  block_ips:
  - 0.0.0.0
  - 127.0.0.1
proxies:
# ================================================================ 节点（占位，必须替换）
# ★ 这一段是占位示例。**保留「5 个域名节点 + 1 个 IP 节点」这个结构是有意的** ——
#   它正好演示本配置最关心的那件事：
#     server 写成**域名** ⇒ 隧道建立之前必须先解析它，而这次解析只能在**直连侧**发生
#       （代理还没通，不可能让代理去解析它自己的地址），因此它是全篇**唯一一条
#       无法用 no_resolve 消除的解析面**。本配置用 dns.forward 第 3 条显式接住它。
#     server 写成 **IP 字面量** ⇒ 这条解析面直接归零（看下面第 1 个节点）。
#   结论：能写 IP 就写 IP。这是唯一从根上消除「节点域名解析」的办法。
# ==============================================================================
# ---- 形态 ①：server 为 IP 字面量 —— 零解析，最干净 ---------------------------------
- vless:
    name: 🇺🇸 Node-1 (IP)
    server: 203.0.113.10            # 示例 IP（RFC 5737 TEST-NET-3，不可路由，请替换）
    port: 443
    user_id: 00000000-0000-4000-8000-000000000001
    tfo: false
    udp_relay: true
    flow: xtls-rprx-vision
    transport:
      tls:
        sni: www.example.com
        reality:
          public_key: REPLACE_WITH_YOUR_REALITY_PUBLIC_KEY
          short_id: ''
        skip_tls_verify: false
# ---- 形态 ②：server 为域名 —— 多出一条"必须在直连侧发生"的解析 --------------------
- hysteria2:
    name: 🇸🇬 Node-2
    server: sg.example-node.com
    port: 443
    auth: REPLACE_ME
    sni: sg.example-node.com
    skip_tls_verify: true
- hysteria2:
    name: 🇺🇸 Node-3
    server: us2.example-node.com
    port: 443
    auth: REPLACE_ME
    sni: us2.example-node.com
    skip_tls_verify: true
- vless:
    name: 🇯🇵 Node-4
    server: jp1.example-node.net
    port: 443
    user_id: 00000000-0000-4000-8000-000000000004
    tfo: false
    udp_relay: true
    flow: xtls-rprx-vision
    transport:
      tls:
        sni: www.example.com
        reality:
          public_key: REPLACE_WITH_YOUR_REALITY_PUBLIC_KEY
          short_id: ''
        skip_tls_verify: false
# ---- 中转链：prev_hop 指向一个订阅组 ------------------------------------------------
- https:
    name: 🇨🇳 TW-Relay
    server: tw-relay.example-cdn.com
    port: 443
    username: REPLACE_ME
    password: REPLACE_ME
    tfo: false
    skip_tls_verify: true
    prev_hop: Airport-C
- https:
    name: 🇨🇳 TW-2
    server: tw2-relay.example-cdn.com
    port: 443
    username: REPLACE_ME
    password: REPLACE_ME
    tfo: false
    skip_tls_verify: true
