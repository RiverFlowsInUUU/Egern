# ★ v7 核心改动：Apple_All.list -> Apple_All_No_Resolve.list
#   官方 rules 文档原文：「no_resolve (bool)……设为 true 时仅匹配已解析的 IP 地址，
#   **不会触发 DNS 解析**」—— 反过来说，不带 no_resolve 的 IP 类条目**会触发解析**。
#   Apple_All.list 里有 13 条 IP-CIDR 没带 no-resolve（139.178.128.0/18 等 Apple CDN 段），
#   而这条规则排在 default 之前且 policy=DIRECT（未禁用）⇒ **每个没被前面规则命中的域名，
#   经过这里都会被强制解析一次**。这就是 dnsleaktest 里「判定是 default → Final → Proxy，
#   但 upstream 显示 bootstrap」的来源：为了判定这条 IP 规则而触发的解析走了明文。
#   No_Resolve 版与原版逐条等价（只是那 13 条补上 ,no-resolve），覆盖面无损失；
#   对 IP 形式的连接判定也完全不受影响（IP 本就无需解析）。
#   全部 20 个远程规则集已逐个下载核对：**只有 Apple_All.list 存在这个缺陷**。
- rule_set:
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple_All_No_Resolve.list
    policy: DIRECT
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list
    policy: WeChat
- domain_suffix:
    name: 小红书 CDN
    match: xhscdn.com
    policy: DIRECT
    disabled: false
# ★ v8 核心改动：ChinaMax.list -> ChinaMax_All_No_Resolve.list
#   事故现象：v7 把 DNS 泄露治住之后，国内域名整片落到 default → Final → Proxy。
#   根因不在 DNS，在**分流**：v7 给 geoip:CN 加的 no_resolve（治泄露的关键，
#   官方语义「不会触发 DNS 解析」）同时让 geoip **不再匹配域名** —— 而这条 geoip
#   正是原配置里国内域名走直连的唯一机制：
#       收到域名 → 强制本地解析（当年泄露的来源）→ 判出 CN IP → DIRECT。
#   机制撤掉后本该补位的 ChinaMax 兜不住：按该仓库自己的 README，
#   `ChinaMax.list` 只是 **IP 规则集**（实测 12614 条里 12472 条是 IP-CIDR/IP-CIDR6，
#   域名条目只有 64 条），域名规则在同目录 `ChinaMax_Domain.list` 里，
#   README 明写「ChinaMax.list、ChinaMax_Domain.list 共同使用」。
#   ⇒ 现象即「ChinaMax 里基本只有一些 IP 走直连、国内域名都走 final」。
#   All_No_Resolve 版 = 同一份 IP 段（去 ,no-resolve 后 12472 条逐条相同）
#   + 111268 条域名条目（旧版 64 条全被包含，零损失），
#   且 **12472 条 IP 条目全部带 ,no-resolve** ⇒ 不会重新引入「为判定而强制解析」。
- rule_set:
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMax/ChinaMax_All_No_Resolve.list
    policy: DIRECT
# .cn 直连兜底：geoip 加了 no_resolve 后无法匹配域名。上面的 ChinaMax_All_No_Resolve
# 已覆盖绝大多数国内域名；这一条把整个 .cn TLD 再钉一次，不依赖规则集是否加载成功。
- domain_suffix:
    match: cn
    policy: DIRECT
- geoip:
    match: CN
    policy: DIRECT
    no_resolve: true
- default:
    name: Final
    policy: Final
# ================================================================ MITM（模板已移除）
# ⚠️ 原配置这里带 `ca_p12` + `ca_passphrase` —— 那是**个人 MITM CA 的私钥**（PKCS#12）。
#    它一旦公开，任何人都能用它解密你经 MITM 的 TLS 流量并签发任意证书，
#    所以**绝对不要提交到任何仓库**。本模板整个 mitm 段已注释掉。
#    注意：本配置的防 DNS 泄露**完全不需要 MITM**（靠的是 dns 段 + no_resolve +
#    规则集筛选），需要用到 MITM 时再自行生成 CA 并在本地填写。
# mitm:
#   ca_p12: <在此填入你自己生成的 base64 PKCS#12>
#   ca_passphrase: <你的口令>

default_proxy_group: Proxy
